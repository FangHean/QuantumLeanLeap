name: Lean and benchmark
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - run: python3 scripts/verify_qhl.py
      - run: python3 -m unittest discover -s scripts -p 'test_bench.py' -v
      - run: python3 -m unittest discover -s scripts -p 'test_qhl_candidate.py' -v
      - run: python3 scripts/bench.py evaluate bench/references.jsonl --output artifacts/bench/ci-reference --k 1
      - name: Require all reference certificates
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/bench/ci-reference/report.json'))
          assert all(x['status']=='accepted' for x in r['results'])
          PY
      - run: python3 scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: QuantumLeanLeap-source-and-evidence
          path: |
            dist/
            artifacts/qhl/
            artifacts/bench/ci-reference/
